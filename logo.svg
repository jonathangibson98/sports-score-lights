<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>

    <!-- Team Home Glow (Red/Magenta) -->
    <linearGradient id="teamHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff5e00"/>
    </linearGradient>

    <!-- Team Away Glow (Cyan/Blue) -->
    <linearGradient id="teamAway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05d5e7"/>
      <stop offset="100%" stop-color="#0056ff"/>
    </linearGradient>

    <!-- Scoreboard Text Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Outer Glow Ring Split -->
  <path d="M 256 60 A 196 196 0 0 0 256 452 Z" fill="none" stroke="url(#teamHome)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 452 A 196 196 0 0 0 256 60 Z" fill="none" stroke="url(#teamAway)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Stadium Light Rays -->
  <g stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="140" y1="140" x2="80" y2="80" stroke="url(#teamHome)"/>
    <line x1="100" y1="256" x2="20" y2="256" stroke="url(#teamHome)"/>
    <line x1="140" y1="372" x2="80" y2="432" stroke="url(#teamHome)"/>
    
    <line x1="372" y1="140" x2="432" y2="80" stroke="url(#teamAway)"/>
    <line x1="412" y1="256" x2="492" y2="256" stroke="url(#teamAway)"/>
    <line x1="372" y1="372" x2="432" y2="432" stroke="url(#teamAway)"/>
  </g>

  <!-- Central Lightbulb Outline -->
  <g transform="translate(0, -10)">
    <!-- Left Half Bulb (Home Color) -->
    <path d="M 256 120 C 180 120 160 180 190 240 C 210 280 220 300 220 330 L 256 330 Z" fill="url(#teamHome)" opacity="0.85"/>
    
    <!-- Right Half Bulb (Away Color) -->
    <path d="M 256 120 C 332 120 352 180 322 240 C 302 280 292 300 292 330 L 256 330 Z" fill="url(#teamAway)" opacity="0.85"/>

    <!-- Bulb Screw Base -->
    <rect x="226" y="345" width="60" height="12" rx="6" fill="#a0a0b0"/>
    <rect x="232" y="363" width="48" height="10" rx="5" fill="#808090"/>
    <rect x="238" y="379" width="36" height="8" rx="4" fill="#606070"/>
    <path d="M 246 387 L 266 387 L 256 397 Z" fill="#404050"/>

    <!-- Scoreboard / Game Bolt Accent inside Bulb -->
    <path d="M 250 170 L 225 230 L 255 230 L 245 290 L 285 220 L 257 220 Z" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
